<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <div class="card">
        <h1>Snake</h1>
        <div class="hud">
          <span id="scoreDisplay">Score: 0</span>
          <button id="restartBtn" aria-label="Restart game">Restart</button>
        </div>
        <canvas id="gameCanvas" width="400" height="400" aria-label="Snake game board"></canvas>
        <div id="gameOver" class="overlay" role="dialog" aria-hidden="true">
          <div class="overlay-card">
            <h2>Game Over</h2>
            <p>Your score: <span id="finalScore">0</span></p>
            <button id="restartOverlayBtn">Play Again</button>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
